name: Motion or integration proposal
description: Propose a useful pattern, refinement, or integration improvement.
title: "proposal: "
body:
  - type: textarea
    id: action
    attributes:
      label: What action should improve?
      description: Describe the everyday interface action and the people who would use it.
      placeholder: "When someone edits an item inline…"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the transition or developer workflow. Include an example or reference if useful.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: How does it fit the collection?
      description: Name a pattern to improve, or explain the gap a new pattern would fill. Identify the host state or existing component it would use.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Acceptance criteria
      description: Describe observable results, including interaction, integration, and accessibility where relevant.
      placeholder: "- Repeated input settles to the latest value."
    validations:
      required: true
